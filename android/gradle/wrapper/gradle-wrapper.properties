# Gradle 8.9: AGP 8.5.2 requires 8.7 or newer.
#
# gradlew and gradle-wrapper.jar are deliberately absent - a wrapper jar is a
# binary, and one committed by someone you cannot ask about it is worth less
# than one your own tooling generates. Android Studio reads this file to pick
# the right Gradle and writes the rest itself on first sync; after that,
# ./gradlew works as usual.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
